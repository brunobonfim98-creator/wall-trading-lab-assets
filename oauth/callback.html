<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Wall Trading Lab OAuth</title>
  <style>
    body{font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:#0f172a;color:#e5e7eb;display:grid;place-items:center;min-height:100vh;margin:0;padding:24px}
    main{max-width:620px;text-align:center}
    h1{color:#34d399}
  </style>
</head>
<body>
<main>
  <h1>Wall Trading Lab</h1>
  <p id="status">OAuth callback endpoint ready.</p>
</main>
<script>
(() => {
  const params = new URLSearchParams(window.location.search);
  const hasOAuthResponse = params.has("code") || params.has("error");

  if (!hasOAuthResponse) return;

  document.getElementById("status").textContent =
    "Autorização recebida. Encaminhando para o aplicativo local…";

  const localCallback = "http://127.0.0.1:8787/callback";
  window.location.replace(
    localCallback + (window.location.search || "") + (window.location.hash || "")
  );
})();
</script>
</body>
</html>
